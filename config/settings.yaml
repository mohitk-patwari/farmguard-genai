# FarmGuard master configuration.
# Secrets (API keys, bot tokens) go in .env, never here.

video:
  source: "data/clips/sample.mp4"   # file path, webcam index (0), or rtsp:// URL
  live: false            # true = drop stale frames (Queue maxsize=1); false = process every frame (evaluation)
  target_fps: 10         # frames per second sent to the detector; 0 = every frame
  resize_width: 960      # 0 = keep original size
  buffer_seconds: 30     # how much recent video the agent can look back/forward into

motion_gate:
  enabled: true
  min_changed_fraction: 0.002   # fraction of pixels that must change to wake the detector
  warmup_frames: 15

detector:
  backend: "ultralytics"        # ultralytics | mock
  model: "weights/yolov8s-worldv2-farmguard.pt"   # made by scripts/bake_world_vocab.py from the classes below
  open_vocabulary: false        # true = call set_classes() at startup: needs CLIP on disk (338 MB download), so keep false
  classes: ["wild boar", "nilgai", "monkey", "elephant", "cow", "dog", "deer"]
  ignore_classes: ["person", "car", "truck", "motorcycle"]
  confidence: 0.25              # boxes below this are kept only if they continue an existing track
  track_conf: 0.1               # what ByteTrack sees. Passing 0.25 here would switch off its low-score second stage (track_low_thresh 0.1)
  clahe:
    enabled: false              # contrast equalisation before detection, for night; see docs/HANDOFF.md for measured effect
    clip_limit: 2.0
    grid: 8
  imgsz: 640
  device: ""                    # "" = auto, "cpu", "cuda:0", "mps"
  tracker: "bytetrack.yaml"

zones:
  file: "config/zones.json"     # created with: farmguard draw-zone <video>
  anchor: "bottom_center"       # point of the box tested against the polygon (animal's feet)

trigger:
  window: 7                     # vote window (frames)
  min_hits: 4                   # animal must be in the zone in >= min_hits of the last `window` frames
  track_cooldown_s: 60          # same track cannot re-trigger the first alarm within this time
  species_cooldown_s: 60        # a new track id of the same species cannot start an event within this time (T1 smoke test: 11 events from one 10 s clip)
  min_box_area_frac: 0.0005     # ignore tiny far-away boxes

alarm:
  backend: "auto"               # auto | pygame | simpleaudio | aplay | afplay | none
  sounds_dir: "sounds"
  first_sound_policy: "species_default"   # species_default | random_allowed

agent:
  enabled: true
  provider: "ollama"            # ollama | gemini | anthropic | openai_compat | mock
  vlm_model: "qwen2.5vl:3b"     # 7b needs more than this laptop's 6 GB VRAM (HANDOFF smoke test). On Colab set both to qwen2.5vl:7b
  llm_model: "qwen2.5vl:3b"     # can be a text-only model; the policy step sends no images
  models:                       # per-provider ids; win over vlm_model/llm_model (those stay the Ollama tags)
    gemini: {vlm: "gemini-3.8-flash", llm: "gemini-3.8-flash"}
    anthropic: {vlm: "claude-haiku-5-5", llm: "claude-haiku-5-5"}   # opt-in, cheapest model
    # openai_compat: {vlm: "...", llm: "..."}   # depends on the server
  seed: 42                      # sent to Ollama with temperature, so a rerun repeats its answers; logged per decision
  temperature: 0.2              # null = don't send. Anthropic always runs at default sampling (400 on API version 2026-10-21): state it in E2
  ollama:
    num_ctx: 4096               # sent per call. 8192 took free RAM to 1.5 GB on the laptop. 3b prompts must fit: see clip.max_side, clip.max_images
  timeout_s: 120                # per attempt
  max_retries: 2                # transient errors only (timeouts, connection, 408/409/425/429/5xx)
  backoff_base_s: 1.0           # 1 s, 2 s, ... with jitter; a Retry-After header wins if longer
  max_total_s: 180              # ceiling per generate_json: no retry/repair unless a further timeout_s fits
  clip:
    frames_before: 2            # neighbouring frames sent with the trigger frame
    frames_after: 2
    crop_padding: 0.25          # AlexKapy: 15-25% padding around the box
    max_side: 448               # longest side, event and retreat images. Qwen2.5-VL tokens scale with pixels
    max_images: 3               # crop + full frame + 1 neighbour; also the retreat check's frames. ~1030 tokens per image
                                # on Ollama whatever max_side (smoke test 2): 4 overflowed 4096. Few-shot: raise num_ctx
  fewshot:                      # labelled examples sent before the event images (E2 ablates this)
    enabled: false              # off until E2 shows it helps on our model; BLIP's 7.61% -> 91.0% was another model and task
    dir: "data/fewshot"         # <dir>/<species key, none or other_animal>/*.jpg
    per_species: 3              # 3-5; about 21 images per call at 3 (5 species + none + other_animal), so expect slower calls
    max_side: 384
  vlm:
    override_species: true      # a confident VLM species replaces the detector's for sounds, policy, alert, memory.
                                # T1's boar clip: detector said stray_cattle / elephant on every event. false = detector only
    override_min_confidence: "high"   # high | medium. events.jsonl logs the effective species at none/high/medium for E2. Also: VLM "none" at high = possible false alarm (quiet note)
  retreat:
    observe_seconds: 12         # how long after a deterrent we watch
    gone_frames: 15             # consecutive frames with no animal in zone = gone (tracker evidence)
    use_vlm: true
    min_frames: 10              # fewer frames before the clip/stream ended = "truncated": no verdict, nothing to memory.
                                # Smoke test 2 recorded a success from ONE end-of-clip frame
  policy:
    type: "llm"                 # llm | llm_bandit | fixed | random | rule_chain | bandit | bandit_sw
    shuffle_options: true       # shuffle legal sounds in the enum and the prompt per call, seeded by (seed, event, attempt).
                                # E4 773ad66: 3b picked the first-listed sound in 75% of calls. false = that ordered run
    constrain_enum: true        # enum = legal actions only (untried, off cooldown). false = old enum: reproduces T4's
                                # probe (21.7% of 3b answers picked a sound that already failed)
    immediate_escalation_species: ["elephant"]   # may go to the farmer before attempt 2 (danger to people)
    bandit_window: 20           # bandit_sw: Thompson sampling over the newest N outcomes per species x time bucket
    max_attempts: 3             # after this many failed deterrents, escalate to the farmer
    sound_cooldown_s: 20
    decision_log: "data/policy_decisions.jsonl"   # full prompt + response per LLM decision (paper examples, invalid-action rate)
  notifier:
    provider: null              # farmer alerts only: null = agent.provider; e.g. "gemini" (needs GEMINI_API_KEY).
                                # Fails or no key -> the agent's own model -> the template
  include_location_in_prompt: false   # keep false: location hints made Claude answer from geography (~10% acc)
  adaptive_first_sound: true    # after each event the agent picks the next first alarm (cached; no LLM call in the alarm path)

notifier:
  language: "hi"                # hi | mr | en
  channels: ["console"]         # console | telegram
  voice_note: true              # gTTS voice note when telegram is enabled
  nightly_summary_hour: 7       # summary covers the 24 h before this hour, up to now; schedule `python -m farmguard.agent.farmer summary`

memory:
  db_path: "data/farmguard.sqlite"

logging:
  level: "INFO"
  events_jsonl: "data/events.jsonl"
  timing_csv: "data/timing.csv"
